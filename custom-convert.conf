# custom-convert.conf — deployment reference
#
# This file is NOT read from the repo. It is deployed to the LMS server's
# preferences directory, where LMS merges it with the stock convert.conf.
#   VPS path:        /home/harmonizer/lms-vps/data/config/prefs/custom-convert.conf
#   In container:    /config/prefs/custom-convert.conf
#
# What it does: adds a `tee` to the Spotify→FLAC transcode command, but ONLY
# for the player whose MAC matches the 4th field below. For every other player
# the stock rule is used unchanged, so the normal listening path is untouched.
#
# LMS invokes this command once per track, so each invocation writes exactly one
# song to _current.flac. archiveWatcher.js (in the cloud-squeeze app) watches the
# LMS CLI for "playlist newsong" and renames _current.flac to "Artist - Title.flac".
#
# The /archive path is a dedicated volume mounted into BOTH the lms and
# cloud-squeeze containers (./data/archive on the host). LMS writes there via tee;
# cloud-squeeze renames/serves from there. The music library mount stays read-only.
#
# Format of the rule header:  <inputformat> <outputformat> <clienttype> <clientid|*>
# Scoping to a MAC in the 4th field is what limits the tee to one player.

spt flc * 00:04:20:1f:2c:56
	# RT:{START=--start-position %s}
	[spotty] -n Squeezebox -c "$CACHE$" --single-track $URL$ --bitrate 320 --disable-discovery --disable-audio-cache $START$ | [flac] -cs --channels=2 --sample-rate=44100 --bps=16 --endian=little --sign=signed --fast --totally-silent --ignore-chunk-sizes - | tee /archive/_current.flac
